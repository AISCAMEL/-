<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カーメル かんたん審査診断</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --ground:#eef2f7; --card:#fff; --ink:#18212f; --muted:#5f6a7a; --faint:#9aa6b4;
    --border:#d2dbe6; --brand:#2a6fd4; --brand-ink:#fff; --brand-soft:#e7f0ff; --go:#06c755;
    --rankA:#0e9d54; --rankB:#2a6fd4; --rankC:#c07a10; --rankD:#c0433c;
    --radius:12px; --shadow:0 1px 2px rgba(20,30,50,.05),0 10px 30px rgba(20,30,50,.08);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0d131e; --card:#151d29; --ink:#e8edf4; --muted:#9aa5b4; --faint:#6a7688;
    --border:#2a3545; --brand:#5f9bff; --brand-ink:#08142a; --brand-soft:#16233a; --go:#22c96a;
    --rankA:#3fbb74; --rankB:#5f9bff; --rankC:#e0a53a; --rankD:#f0736c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --ground:#0d131e; --card:#151d29; --ink:#e8edf4; --muted:#9aa5b4; --faint:#6a7688;
    --border:#2a3545; --brand:#5f9bff; --brand-ink:#08142a; --brand-soft:#16233a; --go:#22c96a;
    --rankA:#3fbb74; --rankB:#5f9bff; --rankC:#e0a53a; --rankD:#f0736c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--ground); color:var(--ink); font-size:15px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;}
  .app{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
  header{background:var(--brand); color:var(--brand-ink); padding:18px 18px 15px}
  header h1{margin:0; font-size:18px; font-weight:800}
  header p{margin:5px 0 0; font-size:12.5px; color:#dbe8ff}
  main{flex:1; padding:16px}
  .lead{color:var(--muted); font-size:13px; margin:0 0 14px}
  .f{margin-bottom:13px}
  .f label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px}
  input,select{width:100%; font:inherit; font-size:15px; padding:12px 13px; border:1px solid var(--border);
    border-radius:10px; background:var(--card); color:var(--ink); appearance:none}
  input::placeholder{color:var(--faint)}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .suf{position:relative} .suf span{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:12px; font-weight:700; pointer-events:none} .suf input{padding-right:40px}
  .cond{display:none} .cond.on{display:block}
  footer{position:sticky; bottom:0; background:linear-gradient(to top,var(--card) 72%,transparent); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border)}
  .btn{width:100%; font:inherit; font-weight:800; border:0; border-radius:12px; padding:15px; font-size:16px; cursor:pointer}
  .btn.diag{background:var(--brand); color:var(--brand-ink)}
  .btn.go{background:var(--go); color:#fff}
  .btn.ghost{background:var(--ground); color:var(--muted); border:1px solid var(--border); margin-top:10px}
  .note{color:var(--faint); font-size:11px; margin:10px 2px 0; line-height:1.7}
  /* result */
  .result{display:none; padding:24px 18px 40px; text-align:center} .result.on{display:block}
  .result h2{margin:0 0 4px; font-size:19px; font-weight:800}
  .result .sub{color:var(--muted); font-size:13px; margin-bottom:16px}
  .rankcard{background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:22px 18px; margin-bottom:16px}
  .rk{width:88px; height:88px; border-radius:22px; display:grid; place-items:center; color:#fff; font-size:48px; font-weight:800; margin:0 auto 10px}
  .rk.A{background:var(--rankA)}.rk.B{background:var(--rankB)}.rk.C{background:var(--rankC)}.rk.D{background:var(--rankD)}
  .rk-msg{font-weight:800; font-size:16px} .rk-msg small{display:block; color:var(--muted); font-weight:600; font-size:12px; margin-top:4px}
  .score{margin-top:12px; color:var(--muted); font-size:13px; font-weight:700}
  .disc{color:var(--faint); font-size:11px; line-height:1.7; margin-top:14px}
  .banner{display:none; margin:10px 16px 0; padding:9px 12px; border-radius:9px; font-size:12px; font-weight:700; background:#fdf2e0; color:#a3670b}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header><h1>かんたん審査診断</h1><p>最短30秒・登録不要で、通過の目安ランクが分かります。</p></header>
  <div class="banner" id="banner"></div>

  <main id="main">
    <p class="lead">当てはまるものを選ぶだけ。結果はその場で表示されます。</p>
    <div class="f"><label>雇用形態</label>
      <select id="employment_type"><option>正社員</option><option>契約社員</option><option>派遣</option><option>自営業</option><option>法人役員</option><option>パート・アルバイト</option><option>無職</option><option>年金</option><option>障害年金</option></select></div>
    <div class="f"><label>勤続（年・月）</label>
      <div class="two"><div class="suf"><input id="tenure_y" type="number" inputmode="numeric" min="0" placeholder="3"><span>年</span></div><div class="suf"><input id="tenure_m" type="number" inputmode="numeric" min="0" max="11" placeholder="6"><span>月</span></div></div></div>
    <div class="f"><label>年収</label><div class="suf"><input id="annual_income" type="number" inputmode="numeric" min="0" placeholder="400"><span>万円</span></div></div>
    <div class="f"><label>他社お借入</label><div class="suf"><input id="other_debt" type="number" inputmode="numeric" min="0" placeholder="0"><span>万円</span></div></div>
    <div class="f"><label>ローン・事故情報</label>
      <select id="incident"><option>なし</option><option>延滞歴あり</option><option>債務整理</option><option>民事再生</option><option>自己破産</option></select></div>
    <div class="f cond" id="incCond"><label>その事情から何年経過</label><div class="suf"><input id="incident_years" type="number" inputmode="numeric" min="0" placeholder="例：3"><span>年</span></div></div>
    <div class="f"><label>住居形態</label><select id="residence"><option>持ち家</option><option selected>賃貸</option><option>その他</option></select></div>
    <div class="f"><label>生年月日</label><input id="birth_date" type="date" min="1940-01-01" max="2008-12-31"></div>
    <div class="f"><label>ご希望の月額</label><div class="suf"><input id="assumed_monthly" type="number" inputmode="numeric" placeholder="3"><span>万円</span></div></div>
    <p class="note">※ 表示されるランクは入力内容からの目安で、最終審査の合否を保証するものではありません。</p>
  </main>

  <footer id="footer"><button class="btn diag" id="diag">診断する</button></footer>

  <div class="result" id="result">
    <div class="rk A" id="rk">A</div>
    <h2 id="rkTitle">診断結果</h2>
    <div class="rankcard">
      <div class="rk-msg" id="rkMsg"></div>
      <div class="score" id="rkScore"></div>
    </div>
    <button class="btn go" id="toApply">この内容で申込む</button>
    <button class="btn ghost" id="again">もう一度診断する</button>
    <p class="disc">「申込む」を押すと、入力内容を引き継いで本申込フォームが開きます（この時点ではまだ登録されません）。</p>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const LIFF_ID  = "0000000000-xxxxxxxx";  // ← LINE DevelopersのLIFF ID（診断用）に置き換え
const APPLY_URL = "https://new-repository-livid-one.vercel.app/apply"; // 本申込フォーム
/* ================ */

const $=s=>document.querySelector(s);
let LINE_NAME="", LINE_UID="";

// LIFF初期化（LINE外・未設定でも診断は動く）
(async function(){
  try{
    if(typeof liff==="undefined" || LIFF_ID.startsWith("0000000000")) throw 0;
    await liff.init({liffId:LIFF_ID});
    if(liff.isLoggedIn()){ const p=await liff.getProfile(); LINE_NAME=p.displayName||""; LINE_UID=p.userId||""; }
  }catch(e){
    const b=$('#banner'); b.textContent="テストモード（LINEアプリ外）。診断・引き継ぎはそのまま動作します。"; b.style.display="block";
  }
})();

$('#incident').addEventListener('change',()=>{ $('#incCond').classList.toggle('on', $('#incident').value!=='なし'); });

/* ===== 本番と同じ computeScore（lib/scoring.ts 準拠） ===== */
const EMP={'正社員':20,'契約社員':12,'派遣':12,'自営業':10,'法人役員':10,'パート・アルバイト':6,'無職':0,'年金':0,'障害年金':0};
const INC={'なし':20,'延滞歴あり':8,'債務整理':-10,'民事再生':-15,'自己破産':-25};
const RES={'持ち家':10,'賃貸':5,'その他':0};
const NO_WORK=['無職','年金','障害年金'], SELF=['自営業','法人役員'], SEVERE=['自己破産','債務整理'];
function incMul(y){y=y||0; if(y>=7)return .15; if(y>=5)return .40; if(y>=2)return .70; return 1;}
function age(v){if(!v)return 0;const d=new Date(v),t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a;}
function compute(){
  const inc=+$('#annual_income').value||0, emp=$('#employment_type').value;
  const tm=(+$('#tenure_y').value||0)*12+(+$('#tenure_m').value||0);
  const debt=+$('#other_debt').value||0, incident=$('#incident').value, iy=+$('#incident_years').value||0;
  const res=$('#residence').value, a=age($('#birth_date').value), mo=+$('#assumed_monthly').value||0;
  let s=0;
  s+= inc>=500?30: inc>=300?20: inc>=200?10: inc>0?4:0;
  s+= EMP[emp]||0;
  const t=tm/12; s+= t>=5?15: t>=3?10: t>=1?6:2;
  s+= debt===0?15: debt<100?12: debt<300?6:0;
  const ib=INC[incident]||0; s+= ib<0? ib*incMul(iy): ib;
  s+= RES[res]||0;
  s+= (a>=25&&a<=60)?5:(a>0?2:0);
  if(inc>0&&mo>0){const dti=(mo*12)/inc; s+= dti<=0.20?15: dti<=0.30?10: dti<=0.40?5:-10;}
  let f=Math.max(0,Math.min(100,Math.round(s)));
  if(SEVERE.includes(incident)&&iy<1) f=Math.min(f,20);
  if(NO_WORK.includes(emp)||tm<=3||(SELF.includes(emp)&&tm<12)) f=Math.min(f,5);
  return {score:f, rank:(f>=80?'A':f>=60?'B':f>=40?'C':'D')};
}

$('#diag').addEventListener('click',()=>{
  const r=compute();
  $('#rk').textContent=r.rank; $('#rk').className='rk '+r.rank;
  const M={A:['審査通過の見込み 高','提携信販へ優先的にお繋ぎします'],
    B:['審査通過の見込み あり','複数の提携先で審査可能です'],
    C:['要検討・条件次第','自社ローン等もご提案します'],
    D:['審査が難しい可能性','担当が個別にご相談します']}[r.rank];
  $('#rkMsg').innerHTML=M[0]+'<small>'+M[1]+'</small>';
  $('#rkScore').textContent='目安スコア '+r.score+'点';
  $('#main').style.display='none'; $('#footer').style.display='none'; $('#banner').style.display='none';
  $('#result').classList.add('on'); window.scrollTo({top:0});
});
$('#again').addEventListener('click',()=>{ $('#result').classList.remove('on'); $('#main').style.display=''; $('#footer').style.display=''; window.scrollTo({top:0}); });

// 「申込む」→ 診断値＋LINE名前/IDを引き継いで本申込フォームへ
$('#toApply').addEventListener('click',()=>{
  const q=new URLSearchParams();
  const put=(k,sel)=>{ const v=$(sel).value; if(v!=='') q.set(k,v); };
  put('employment_type','#employment_type'); put('tenure_y','#tenure_y'); put('tenure_m','#tenure_m');
  put('annual_income','#annual_income'); put('other_debt','#other_debt'); put('incident','#incident');
  put('incident_years','#incident_years'); put('residence','#residence'); put('birth_date','#birth_date');
  put('assumed_monthly','#assumed_monthly');
  if(LINE_NAME) q.set('applicant_name', LINE_NAME);
  if(LINE_UID)  q.set('line_uid', LINE_UID);
  q.set('from','診断');
  location.href = APPLY_URL + '?' + q.toString();
});
</script>
</body>
</html>
