<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CARMEL 加盟店だより</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2b2b;--muted:#8a8a8a;--line:#e7e3da;--paper:#fff;--bg:#faf8f4;--gold:#b5913f;--gold-d:#917226;--navy:#2a3345;--serif:"Noto Serif JP",serif;--sans:"Noto Sans JP",sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.9;font-size:15px;}
  a{color:var(--gold-d);text-decoration:none;} a:hover{text-decoration:underline;}
  .site-head{background:var(--paper);border-bottom:1px solid var(--line);text-align:center;padding:26px 16px 0;}
  .site-title{font-family:var(--serif);font-weight:900;font-size:1.9rem;letter-spacing:.04em;color:var(--navy);}
  .site-title b{color:var(--gold-d);}
  .tagline{color:var(--muted);font-size:.84rem;margin-top:2px;}
  .gnav{margin-top:18px;border-top:1px solid var(--line);}
  .gnav ul{list-style:none;display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin:0;padding:0;max-width:1080px;margin:0 auto;}
  .gnav a{display:block;padding:13px 18px;font-size:.9rem;color:var(--ink);border-bottom:3px solid transparent;cursor:pointer;}
  .gnav a.on{color:var(--gold-d);border-bottom-color:var(--gold);font-weight:700;}
  .container{max-width:1080px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:1fr 280px;gap:30px;}
  /* 記事 */
  .post{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:22px 24px;margin-bottom:22px;}
  .post .cat-meta{font-size:.74rem;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;}
  .post .cat-meta .c{color:var(--gold-d);font-weight:700;}
  .post .pin{background:var(--gold);color:#fff;font-size:.66rem;font-weight:700;border-radius:3px;padding:1px 7px;margin-left:6px;}
  .post h2{font-family:var(--serif);font-weight:700;font-size:1.3rem;margin:2px 0 10px;color:var(--navy);line-height:1.5;}
  .post .excerpt{color:#45454a;font-size:.92rem;}
  .readmore{display:inline-block;margin-top:12px;font-weight:700;font-size:.84rem;}
  .post.full .excerpt{white-space:pre-wrap;}
  .pagetitle{font-family:var(--serif);font-size:1.2rem;color:var(--navy);border-left:4px solid var(--gold);padding-left:12px;margin:0 0 18px;}
  /* サイドバー */
  .widget{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:20px;}
  .widget h3{font-family:var(--serif);font-size:.98rem;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:8px;margin:0 0 12px;}
  .prof{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
  .prof .n{font-size:1.1rem;font-weight:700;color:var(--gold-d);} .prof .l{font-size:.68rem;color:var(--muted);}
  .widget input{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-family:inherit;font-size:.9rem;}
  .catlist{list-style:none;margin:0;padding:0;}
  .catlist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.88rem;cursor:pointer;}
  .catlist li:hover{color:var(--gold-d);}
  .catlist .cnt{color:var(--muted);font-size:.78rem;}
  .recent{list-style:none;margin:0;padding:0;}
  .recent li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:.84rem;cursor:pointer;line-height:1.5;}
  .recent .d{color:var(--muted);font-size:.72rem;}
  .about{font-size:.84rem;color:#555;}
  .foot{background:var(--navy);color:#cfd6e2;text-align:center;padding:18px;font-size:.78rem;margin-top:10px;}
  @media(max-width:820px){.container{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="site-head">
  <div class="site-title"><b>CARMEL</b> 加盟店だより</div>
  <div class="tagline">カーメル加盟店のための、お知らせ・学び・資料</div>
  <nav class="gnav"><ul id="gnav">
    <li><a data-view="notices" class="on">お知らせ</a></li>
    <li><a data-view="courses">研修</a></li>
    <li><a data-view="scripts">スクリプト</a></li>
    <li><a data-view="docs">資料</a></li>
  </ul></nav>
</header>

<div class="container">
  <main>
    <h2 class="pagetitle" id="pageTitle">お知らせ</h2>
    <div id="posts"></div>
  </main>
  <aside>
    <div class="widget"><h3>加盟店プロフィール</h3>
      <div class="prof">
        <div><div class="n" id="wNotice">0</div><div class="l">未読</div></div>
        <div><div class="n" id="wProg">0%</div><div class="l">研修進捗</div></div>
        <div><div class="n" id="wDocs">0</div><div class="l">資料</div></div>
      </div>
    </div>
    <div class="widget"><h3>検索</h3><input id="q" placeholder="キーワード"></div>
    <div class="widget"><h3>カテゴリ</h3><ul class="catlist" id="catlist"></ul></div>
    <div class="widget"><h3>最新のお知らせ</h3><ul class="recent" id="recent"></ul></div>
    <div class="widget"><h3>このサイトについて</h3><p class="about">カーメル本部が運営する加盟店向けの情報サイトです。お知らせ・研修・トークスクリプト・資料をまとめています。内容は本部の更新に合わせて自動で反映されます。</p></div>
  </aside>
</div>
<div class="foot">© CARMEL 加盟店本部 ／ 社内限定</div>

<script src="assets/js/carmel-data.js"></script>
<script>
(function(){
  var D=CarmelData.load(), view='notices', q='';
  var el=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var LV={important:'重要',notice:'通達',info:'お知らせ',campaign:'キャンペーン'};
  var TITLES={notices:'お知らせ',courses:'研修',scripts:'スクリプト',docs:'資料'};
  function readSet(){try{return JSON.parse(localStorage.getItem('carmel_read')||'[]');}catch(e){return [];}}

  function widgets(){
    var read=readSet();
    el('wNotice').textContent=D.notices.filter(function(n){return read.indexOf(n.id)<0;}).length;
    el('wProg').textContent=(D.courses.length?Math.round(D.courses.reduce(function(a,c){return a+(c.progress||0);},0)/D.courses.length):0)+'%';
    el('wDocs').textContent=D.docs.length;
    var cats=[['notices','お知らせ'],['courses','研修'],['scripts','スクリプト'],['docs','資料']];
    el('catlist').innerHTML=cats.map(function(c){return '<li data-v="'+c[0]+'"><span>'+c[1]+'</span><span class="cnt">'+D[c[0]].length+'</span></li>';}).join('');
    Array.prototype.forEach.call(el('catlist').querySelectorAll('li'),function(li){li.onclick=function(){setView(li.dataset.v);};});
    el('recent').innerHTML=D.notices.slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,5).map(function(n){
      return '<li data-id="'+n.id+'"><div class="d">'+esc(n.date)+'</div>'+esc(n.title)+'</li>';}).join('');
    Array.prototype.forEach.call(el('recent').querySelectorAll('li'),function(li){li.onclick=function(){setView('notices');};});
  }

  function render(){
    el('pageTitle').textContent=TITLES[view];
    var box=el('posts'), h='';
    var f=function(txt){return q===''||(txt||'').toLowerCase().indexOf(q.toLowerCase())>=0;};
    if(view==='notices'){
      D.notices.filter(function(n){return f(n.title)||f(n.body);}).sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||(a.date<b.date?1:-1);}).forEach(function(n){
        h+='<article class="post full"><div class="cat-meta"><span class="c">'+esc(LV[n.lv])+'</span> ・ '+esc(n.cat)+' ・ '+esc(n.date)+(n.pin?'<span class="pin">固定</span>':'')+'</div><h2>'+esc(n.title)+'</h2><div class="excerpt">'+esc(n.body)+'</div></article>';
      });
    } else if(view==='courses'){
      D.courses.filter(function(c){return f(c.title)||f(c.desc);}).forEach(function(c){
        h+='<article class="post"><div class="cat-meta"><span class="c">'+esc(c.num)+'</span> ・ '+esc(c.cat)+' ・ ⏱'+esc(c.time)+' ・ 進捗'+(c.progress||0)+'%</div><h2>'+esc(c.title)+'</h2><div class="excerpt">'+esc(c.desc)+'</div></article>';
      });
    } else if(view==='scripts'){
      D.scripts.filter(function(s){return f(s.title)||f(s.body);}).forEach(function(s){
        h+='<article class="post full"><div class="cat-meta"><span class="c">'+esc(s.cat)+'</span> ・ '+esc(s.cat_l||'')+'</div><h2>'+esc(s.title)+'</h2><div class="excerpt">'+esc(s.body)+'</div></article>';
      });
    } else {
      D.docs.filter(function(d){return f(d.title);}).forEach(function(d){
        var link=d.href?'<a class="readmore" href="'+esc(d.href)+'" target="_blank" rel="noopener">開く →</a>':'<span class="readmore" style="color:#aaa">ダウンロード（準備中）</span>';
        h+='<article class="post"><div class="cat-meta"><span class="c">'+esc(d.cat)+'</span> ・ '+esc((d.type||'').toUpperCase())+' ・ '+esc(d.size||'')+' ・ '+esc(d.date||'')+'</div><h2>'+esc(d.title)+'</h2>'+link+'</article>';
      });
    }
    box.innerHTML=h||'<div class="post">該当する記事がありません。</div>';
  }

  function setView(v){ view=v; q=''; el('q').value=''; Array.prototype.forEach.call(el('gnav').querySelectorAll('a'),function(a){a.classList.toggle('on',a.dataset.view===v);}); render(); }
  Array.prototype.forEach.call(el('gnav').querySelectorAll('a'),function(a){a.onclick=function(e){e.preventDefault();setView(a.dataset.view);};});
  el('q').addEventListener('input',function(){q=this.value;render();});
  CarmelData.onChange(function(nd){D=nd;widgets();render();});
  widgets(); render();
})();
</script>
</body>
</html>
